name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade build

      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1