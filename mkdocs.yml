site_name: TwainMQ
theme:
  name: material
  logo: TwainLogoTransparent.png
  favicon: TwainLogoTransparent.png

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
      - Overview: tutorials/index.md
  - Architecture:
      - Overview: architecture/index.md
      - Message Keys: architecture/message_keys.md      
  - API Reference: api/reference.md